perex: 'Tento dokument popisuje datový formát používaný pro poskytování obecných dopravních informací o situaci na silniční síti ČR: nehod, překážek, kolon, uzavírek a omezení, prací na silnici, akcí správce komunikace a vlivů počasí na sjízdnost. Každá událost se skládá z jednoho nebo více záznamů s vlastní polohou a dobou platnosti; poloha se popisuje současně několika metodami (ALERT-C, OpenLR, úseky sítě Global Network a průběh v souřadnicích ETRS89). Uzavírky a omezení publikuje samostatně také formát x-format:cz-ndic_d2-restrictions-v2.0, který je podmnožinou tohoto formátu. Formát vychází z publikace sit:SituationPublication modelu DATEX II 3.7 a nepoužívá národní rozšíření.'
